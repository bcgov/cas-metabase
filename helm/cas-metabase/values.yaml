replicaCount: 2
image:
  repository: metabase/metabase
  tag: v0.58.6
  pullPolicy: Always
database:
  type: postgres
  clusterReleaseName: cas-metabase-db
  metabaseUserSecretName: cas-metabase-db-cas-postgres-cluster-pguser-metabase
  superuserSecretName: cas-metabase-db-cas-postgres-cluster-pguser-postgres
  dbname: metabase
resources:
  limits:
    cpu: 3000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi
podLabels:
  app.kubernetes.io/component: app

# Config Jetty web server
listen:
  host: "0.0.0.0"
  port: 3000

service:
  externalPort: 80
  internalPort: 3000

livenessProbe:
  initialDelaySeconds: 120
  timeoutSeconds: 30
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 3
  periodSeconds: 5

# Generate k8s NetworkPolicy objects
networkPolicies:
  enable: true

metabaseHPA:
  enable: false
